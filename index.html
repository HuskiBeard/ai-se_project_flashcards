<!doctype html>
<html lang="en">
  <head>
    <title>Flash Card App</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="assets/vendor/normalize.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="page">
    <header class="header" id="header">
      <h2 class="header__title">
        <a class="header__link" href="#">Flash Cards</a>
      </h2>

      <nav class="nav" id="nav">
        <ul class="nav__links">
          <li><a href="#home" class="nav__link">My Decks</a></li>
          <li><a href="#about" class="nav__link">About</a></li>
        </ul>
      </nav>
    </header>
    <main class="page__main-content" id="main-content">
      <section id="carousel-view" class="carousel" hidden>
        <h2 class="carousel__title" id="carousel-title"></h2>
        <div class="carousel__card-wrapper">
          <button
            type="button"
            aria-label="Go to previous card in deck"
            class="carousel__btn carousel__btn_type_left"
            id="carousel-prev"
          ></button>
          <div class="carousel__text" id="carousel-card-text"></div>
          <button
            type="button"
            aria-label="Go to next card in deck"
            class="carousel__btn carousel__btn_type_right"
            id="carousel-next"
          ></button>
        </div>
        <button
          type="button"
          aria-label="Flip card for answer"
          class="carousel__btn carousel__btn_type_flip"
          id="carousel-flip"
        ></button>
      </section>

      <section id="home" data-view="home" aria-labelledby="decks-heading">
        <h1 class="my-decks" id="decks-heading">My Decks</h1>
        <div class="decks">
          <ul class="deck__list">
            <template id="deck-template">
              <li class="deck">
                <a class="deck__link" href="#"></a>
                <div class="deck__text">
                  <h2 class="deck__tags"></h2>
                  <h3 class="deck__card-count"></h3>
                  <button
                    class="deck__delete-button"
                    type="button"
                    aria-label="Delete deck"
                  >
                    <img src="assets/images/delete.svg" alt="delete" />
                  </button>
                </div>
              </li>
            </template>

            <li class="deck__newimage-btn">
              <button class="deck__newimage-text" type="button">
                + New Deck
              </button>
            </li>
          </ul>
        </div>
      </section>

      <section id="about" data-view="about" class="not-found" hidden>
        <h2 class="not-found__title">404 Not Found</h2>
        <p class="not-found__text">
          The page you are looking for does not exist.
        </p>
      </section>

      <section id="not-found" data-view="not-found" class="not-found" hidden>
        <h2 class="not-found__title">404 Not Found</h2>
        <p class="not-found__text">
          The page you are looking for does not exist.
        </p>
      </section>
    </main>
    <footer class="footer" id="footer">&copy; 2026 Carlos Ortiz</footer>
    <script src="assets/js/index.js" type="module"></script>
  </body>
</html>
